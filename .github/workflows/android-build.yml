name: Android APK build (unsigned CI check)

on:
  pull_request:
    paths:
      - "app/**"
      - "build.sh"
      - "config.example.properties"
      - ".github/workflows/android-build.yml"
      - "tools/ci/**"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.sh"
      - "config.example.properties"
      - ".github/workflows/android-build.yml"
      - "tools/ci/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android 9+ unsigned build smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FMP_BUILD_UNSIGNED: "1"
      FMP_BUILD_TOOLS_VERSION: "34.0.0"
      FMP_ANDROID_PLATFORM: "34"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install pinned Android SDK components
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Verify identity, version policy and P-04 safety lock
        run: python3 tools/ci/verify_identity.py

      - name: Confirm legacy signing is fail-closed without secrets
        shell: bash
        run: |
          set -euo pipefail
          # The unsigned flag must be explicitly disabled to test refusal.
          if env -u FMP_SIGNING_KEYSTORE -u FMP_SIGNING_STORE_PASSWORD -u FMP_SIGNING_KEY_ALIAS -u FMP_SIGNING_KEY_PASSWORD \
              FMP_BUILD_UNSIGNED=0 ./build.sh > /tmp/fmp-no-signing.log 2>&1; then
            echo "ERROR: build unexpectedly succeeded without private signing keys" >&2
            exit 1
          fi
          grep -q 'Missing FMP_SIGNING_KEYSTORE' /tmp/fmp-no-signing.log
          test ! -f FreeMyProjector.apk
          test ! -e freemytv.keystore

      - name: Build without a keystore or signing keys
        run: |
          set -euo pipefail
          ./build.sh
          test -s out/aligned.apk
          test ! -f FreeMyProjector.apk
          test ! -e freemytv.keystore

      - name: Verify ZIP, alignment, Android API and checksum
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/34.0.0"
          unzip -tqq out/aligned.apk
          "$BT/zipalign" -c -p 4 out/aligned.apk
          "$BT/aapt2" dump badging out/aligned.apk > out/ci-badging.txt
          "$BT/aapt2" dump xmltree out/aligned.apk AndroidManifest.xml > out/ci-manifest.txt
          python3 tools/ci/verify_trial_manifest.py out/ci-manifest.txt
          grep -Eq "^package: name='com\.fader\.freemyprojector'" out/ci-badging.txt
          grep -Fq "sdkVersion:'28'" out/ci-badging.txt
          grep -Fq "targetSdkVersion:'33'" out/ci-badging.txt

          mkdir -p out/ci-artifacts
          cp out/aligned.apk out/ci-artifacts/FreeMyProjector-UNSIGNED.apk
          (cd out/ci-artifacts && sha256sum FreeMyProjector-UNSIGNED.apk > SHA256SUMS.txt)
          {
            echo "Status: UNSIGNED — NOT INSTALLABLE OR UPDATABLE"
            echo "Revision: ${{ github.sha }}"
            echo "Java: 17"
            echo "SDK platform: android-34"
            echo "Build Tools: 34.0.0"
            echo "Package: com.fader.freemyprojector"
            echo "Android minSdk: 28"
            echo "Android targetSdk: 33"
            echo "Hardware test: NOT PERFORMED"
            echo "P-05 preview: HOME Activity, boot receiver, remote key service DISABLED"
            echo "Signed installation APK is available only through the manual release workflow, with private secrets."
          } > out/ci-artifacts/BUILD-REPORT.txt
          test ! -e freemytv.keystore

      - name: Upload compilation artifact (NOT installable)
        uses: actions/upload-artifact@v4
        with:
          name: FreeMyProjector-UNSIGNED-NOT-INSTALLABLE
          path: out/ci-artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Smoke-test signing with disposable CI key (never upload this APK)
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test_dir="$(mktemp -d)"
          trap 'rm -rf "$test_dir"; rm -f FreeMyProjector.apk' EXIT
          secret="$(openssl rand -hex 24)"
          keytool -genkeypair -noprompt -keystore "$test_dir/test.p12" \
            -storetype PKCS12 -alias ci-throwaway -keyalg RSA -keysize 2048 \
            -validity 1 -dname "CN=CI Throwaway" \
            -storepass "$secret" -keypass "$secret" >/dev/null 2>&1
          FMP_BUILD_UNSIGNED=0 \
          FMP_SIGNING_KEYSTORE="$test_dir/test.p12" \
          FMP_SIGNING_KEY_ALIAS=ci-throwaway \
          FMP_SIGNING_STORE_PASSWORD="$secret" \
          FMP_SIGNING_KEY_PASSWORD="$secret" \
            ./build.sh > "$test_dir/signed-build.log" 2>&1 || {
              echo "Disposable-key signing smoke test failed." >&2
              exit 1
            }
          test -s FreeMyProjector.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --min-sdk-version 28 FreeMyProjector.apk
          echo "PASS: signed using disposable key and verified. This APK will be deleted."
          # Do not upload or cache the disposable private key or signed APK.
